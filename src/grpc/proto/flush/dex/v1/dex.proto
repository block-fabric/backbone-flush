// The public, read-only API of Flush's DEX (doc/public-api.md), served by flushd itself (-publicapi): over gRPC
// (HTTP/2), gRPC-Web and the Connect protocol (JSON or binary, GET for the reads), and as plain REST/JSON under
// /api/v1 (the same messages, printed with these field names and every field present: what flush.markets reads).
//
// Conventions:
//  - Assets by id: 64 lowercase hex digits; ECX, the chain's coin, has none ("" here, null in REST).
//  - Display amounts are doubles in whole units (ECX, tokens); exact amounts are `*_units` strings of integers in
//    the asset's smallest unit (satoshis for ECX). Builds and min-receive amounts are exact.
//  - Heights are Flush block heights; times Unix seconds.
//  - Lists page with an opaque `cursor` (from `next_cursor`, absent at the end).
//  - Nothing here reads or writes a wallet. Text written by creators (names, descriptions, links) is plain data:
//    links are https only (others dropped), as the site requires.
syntax = "proto3";

package flush.dex.v1;

// ---------------------------------------------------------------------------------------------------------
// The chain

message GetStatusRequest {}

message FlushTip {
  uint32 height = 1;
  uint32 time = 2;
  string hash = 3;
  // Seconds between blocks the chain aims at.
  uint32 block_target = 4;
}

message EcashTip {
  uint32 height = 1;
  // The mainchain block's time, if this node knows it (0 otherwise).
  uint32 time = 2;
  string hash = 3;
}

message ChainStatus {
  // ecash, ecashbeta, ecashtest or regtest.
  string network = 1;
  FlushTip flush = 2;
  // The last eCash block this node has on record; null before the first.
  EcashTip ecash = 3;
  uint32 slot = 4;
  bool slot_active = 5;
  // ECX in slot 46's escrow on eCash (its CTIP), as the mainchain node last said; null if not known.
  optional double escrow_ecx = 6;
  uint32 launches_today = 7;
  // Blocks the indexes are behind the tip (0: they are derived with each block).
  uint32 indexer_lag = 8;
  uint32 updated = 9;
  // Whether this node keeps the DEX's market index (-dexindex): trades, candles, holders.
  bool market_index = 10;
  // The rules of launches with parameters (a supply, decimals and fee of their own; an existing asset on a curve).
  LaunchParams launch_params = 11;
  // The least ECX paid out in the next block, in satoshis (an order's, a swap's, a buy's, a bid's: 5000 from
  // small_payout_height, 50000 before), and that height (-1: never on this network).
  uint32 min_payout_sat = 12;
  int32 small_payout_height = 13;
  // The least an order of a pair with ECX is worth on its ECX side, in satoshis (5000 from small_payout_height, 1000000 before).
  uint32 min_order_sat = 14;
}

message LaunchParams {
  // Whether the next block takes them, and their first block (-1: never on this network).
  bool active = 1;
  int32 height = 2;
  uint32 fee_min_bps = 3;
  uint32 fee_max_bps = 4;
  // The network's fee (a launch without parameters).
  uint32 fee_default_bps = 5;
  string supply_min_units = 6;
  string supply_max_units = 7;
  // A curve's supply in units is a multiple of this.
  uint32 supply_multiple_units = 8;
  uint32 decimals_max = 9;
  uint32 decimals_default = 10;
  // The most a launch's allocation is in the next block, in basis points (1000 from allocation10_height, 500 before),
  // and that height (-1: never on this network).
  uint32 allocation_max_bps = 11;
  int32 allocation10_height = 12;
  // Upgrade v7: whether the next block takes a launch's fee split (BuildActionRequest.fee_split), and v7's first block (-1:
  // never on this network); from it a launch's curve fee is 25 % security, 75 % its split's, and the DEX's ECX payouts
  // come in the next block (instant_payouts_active).
  bool fee_split_active = 13;
  int32 v7_height = 14;
  bool instant_payouts_active = 15;
}

// ---------------------------------------------------------------------------------------------------------
// Fees and the launches' rules

message FeeShare {
  // Who gets it: creator, pool (the liquidity it graduates into), liquidity_providers, validators, bidder, security.
  string to = 1;
  // In basis points of the fee.
  double bps = 2;
}

message Fees {
  // The fee of a trade on a launch curve, in basis points of its ECX side.
  optional double trade_bps = 1;
  // How the launch fee is shared (its creator's part, the rest into the pool at graduation).
  repeated FeeShare split = 2;
  // The fee of a swap in a pool of the kind AddLiquidity makes (constant product).
  double pool_fee_bps = 3;
  // What creating a launch costs beyond the network fee (none on this chain: 0).
  optional double launch_fee_ecx = 4;
}

message CurveParams {
  double supply = 1;
  double sale_supply = 2;
  double pool_supply = 3;
  double virtual_ecx = 4;
  double virtual_tokens = 5;
  double graduation_ecx = 6;
  // Token decimals (6).
  uint32 decimals = 7;
  // The most a creator's allocation is, in percent of the supply.
  double max_allocation_percent = 8;
}

message GetStatsRequest {}

message Stats {
  uint32 launches = 1;
  uint32 live = 2;
  uint32 graduated = 3;
  double volume_24h = 4;
  double volume_total = 5;
  double graduation_ecx = 6;
  Fees fees = 7;
  CurveParams curve = 8;
  // ECX the curves hold now plus what those graduated raised.
  double raised_total = 9;
  // Pools (every kind), and those with ECX someone provides for.
  uint32 pools = 10;
  double liquidity_ecx = 11;
}

message GetFeesRequest {}

message PoolKindInfo {
  // constant_product, stable, weighted, concentrated (made by CreatePool); launch and book are made otherwise.
  string curve = 1;
  // Fee tiers it is made with, in millionths of what goes in.
  repeated uint32 fee_tiers_ppm = 2;
}

message FeeSchedule {
  // The pools' fee tiers (millionths: 100, 500, 3000, 10000) and the default pool's fee.
  repeated uint32 pool_fee_tiers_ppm = 1;
  uint32 default_pool_fee_ppm = 2;
  repeated PoolKindInfo kinds = 3;
  // A dynamic fee's bounds, if pools may have one.
  bool dynamic_fees = 4;
  // Launch curves: the fee (millionths of the ECX side) and how it is shared.
  uint32 launch_fee_ppm = 5;
  repeated FeeShare launch_split = 6;
  double launch_graduation_ecx = 7;
  reserved 8;
  // How the network fees of a block are shared (the PoS fee split): the BMM bidder's share now, in basis points,
  // the rest to the validators; null before the split's height.
  optional double network_bidder_bps = 9;
  // The relay fee of this node's mempool, in ECX per kvB (what broadcast transactions must pay at least).
  double min_relay_fee_ecx_per_kvb = 10;
  // How every swap fee is split (millionths of the fee as bps): liquidity_providers, security (the BMM bidder and the
  // validators, with the block's fees). Order books charge none.
  repeated FeeShare swap_split = 11;
}

// ---------------------------------------------------------------------------------------------------------
// Launches

message PoolRef {
  string pool = 1;
  string asset_a = 2;
  string asset_b = 3;
}

message LaunchLink {
  string label = 1;
  string url = 2;
}

// LaunchSummary and LaunchDetail share their field numbers (a detail is a summary and more).
message LaunchSummary {
  string id = 1;
  string ticker = 2;
  string name = 3;
  optional string logo = 4;
  string creator = 5;
  uint32 created_height = 6;
  uint32 created_time = 7;
  // curve, graduating (its curve reached the end in the last block), graduated.
  string state = 8;
  double raised_ecx = 9;
  double sold = 10;
  double price_ecx = 11;
  double mcap_ecx = 12;
  double volume_24h = 13;
  uint32 trades_24h = 14;
  uint32 holders = 15;
  optional double change_24h = 16;
  optional uint32 graduated_height = 17;
  PoolRef pool = 18;
  // Percent of the graduation amount raised.
  double progress = 19;
  // The curve's pool (before graduation) or the graduated pool.
  string pool_id = 20;
  double volume_total = 21;
  uint32 trades_total = 22;
  // Its asset's decimals, its supply on the curve and in its pool (whole units), whether an existing asset was put on
  // the curve (rather than launched), its curve's fee.
  uint32 decimals = 23;
  double curve_supply = 24;
  double pool_supply = 25;
  bool from_asset = 26;
  double fee_bps = 27;
  // The fee-flow release: its creator kept the control coin (can create more units: a risk shown loudly), and where
  // the creator's part of its fees goes (creator, burn, split).
  bool mintable = 28;
  string fee_destination = 29;
  // What this launch graduates at (its own: 100 ECX for launches made from slot 99's upgrade v6, 500 before).
  double graduation_ecx = 30;
  // Upgrade v7: the split of the tunable part of its fees (v5's destination mapped onto one; empty before v5).
  repeated LaunchFeeShare fee_split = 31;
}

// Upgrade v7: one recipient of a launch's fees' tunable part (75 % of the curve's fee, and the creator's 60 % of its
// locked position's fees). In a BuildActionRequest only `to` and `bps` are read.
message LaunchFeeShare {
  // "creator", "burn" or the address paid.
  string to = 1;
  // In basis points of the tunable part (the shares sum to 10000).
  uint32 bps = 2;
  // creator (claimed: claimlaunch), burn (bought back and burned each block), address (paid by the chain once 0.001 ECX is owed).
  string kind = 3;
  // What it was paid, and what it is owed and not paid yet.
  double paid_ecx = 4;
  double owed_ecx = 5;
}

message LaunchDetail {
  string id = 1;
  string ticker = 2;
  string name = 3;
  optional string logo = 4;
  string creator = 5;
  uint32 created_height = 6;
  uint32 created_time = 7;
  string state = 8;
  double raised_ecx = 9;
  double sold = 10;
  double price_ecx = 11;
  double mcap_ecx = 12;
  double volume_24h = 13;
  uint32 trades_24h = 14;
  uint32 holders = 15;
  optional double change_24h = 16;
  optional uint32 graduated_height = 17;
  PoolRef pool = 18;
  double progress = 19;
  string pool_id = 20;
  double volume_total = 21;
  uint32 trades_total = 22;
  // Its asset's decimals, its supply on the curve and in its pool (whole units), whether an existing asset was put on
  // the curve (rather than launched), its curve's fee.
  uint32 decimals = 23;
  double curve_supply = 24;
  double pool_supply = 25;
  bool from_asset = 26;
  double fee_bps = 27;

  string description = 30;
  repeated LaunchLink links = 31;
  CurveParams curve = 32;
  optional double trade_fee_bps = 33;
  string create_txid = 34;
  double first_buy_ecx = 35;
  double creator_share_percent = 36;
  // The chain's security part of its fee (percent of it); the rest goes into the pool.
  reserved 44;
  double security_share_percent = 45;
  double creator_fees_owed_ecx = 37;
  double creator_fees_paid_ecx = 38;
  double allocation_percent = 39;
  bool allocation_claimed = 40;
  double min_buy_ecx = 41;
  double max_buy_ecx = 42;
  double curve_tokens_left = 43;
  // The fee-flow release (made from its height): a locked full-range position of a concentrated pool at 1 % at
  // graduation (pool_kind concentrated; constant_product before), its fees 60 % to the creator (in ECX, and in its own
  // units: creator_tokens_owed), 40 % to security; where the creator's part goes (creator, burn: bought back and
  // burned each block, split: burn_percent of it); the units burned so far and the ECX waiting to buy back; and
  // whether its creator kept the control coin (mintable: it can create more).
  bool fee_flow = 46;
  string fee_destination = 47;
  double burn_percent = 48;
  bool mintable = 49;
  double burned = 50;
  double buyback_pending_ecx = 51;
  double creator_tokens_owed = 52;
  string pool_kind = 53;
  // What this launch graduates at (its own, as made).
  double graduation_ecx = 54;
  // Upgrade v7: the split of the tunable part of its fees, with what each recipient was paid.
  repeated LaunchFeeShare fee_split = 55;
}

message ListLaunchesRequest {
  // all (default), new (on the curve, made in the last day), near (on the curve, >= 70 % raised), graduated, curve.
  string filter = 1;
  // newest (default; progress for near), oldest, progress, mcap, volume (24 h), trades (24 h).
  string sort = 2;
  // Text in the ticker or the name, or the start of an asset id.
  string q = 3;
  string cursor = 4;
  // 1 to 100 (default 50).
  uint32 limit = 5;
}

message LaunchPage {
  repeated LaunchSummary items = 1;
  optional string next_cursor = 2;
  uint32 total = 3;
}

message GetLaunchRequest {
  // Its ticker (any case) or its asset id.
  string id = 1;
}

message Trade {
  string txid = 1;
  uint32 height = 2;
  uint32 time = 3;
  // buy or sell (of the token, against ECX); for a pair without ECX: of asset_b, against asset_a.
  string side = 4;
  double ecx = 5;
  double tokens = 6;
  double price_ecx = 7;
  // Who got what came out (the result output's or the ECX payout's address).
  string address = 8;
  // curve, pool, book.
  string venue = 9;
  string pool = 10;
  string asset_in = 11;
  string asset_out = 12;
  string amount_in_units = 13;
  string amount_out_units = 14;
  // Pools the order went through (a route: more than one; amounts are the order's own, end to end).
  uint32 hops = 15;
}

message TradePage {
  repeated Trade items = 1;
  optional string next_cursor = 2;
  uint32 total = 3;
}

message ListTradesRequest {
  // A launch (ListLaunchTrades: ticker or id) or a pool (ListPoolTrades: its id).
  string id = 1;
  // Trades of blocks below this height only.
  uint32 before = 2;
  string cursor = 3;
  // 1 to 100 (default 50).
  uint32 limit = 4;
}

message Candle {
  uint32 t = 1;
  double o = 2;
  double h = 3;
  double l = 4;
  double c = 5;
  // Volume in ECX (in asset_a for a pair without ECX).
  double v = 6;
  uint32 n = 7;
}

message GetCandlesRequest {
  string id = 1;
  // 5m, 1h, 4h, 1d.
  string interval = 2;
  uint32 from = 3;
  uint32 to = 4;
}

message CandleList {
  repeated Candle items = 1;
  string interval = 2;
}

message Holder {
  string address = 1;
  double amount = 2;
  double share = 3;
  // creator, curve, pool, or null.
  optional string tag = 4;
}

message ListHoldersRequest {
  string id = 1;
  string cursor = 2;
  // 1 to 100 (default 20).
  uint32 limit = 3;
}

message HolderPage {
  repeated Holder items = 1;
  optional string next_cursor = 2;
  uint32 total = 3;
}

message QuoteLaunchRequest {
  string id = 1;
  // buy (ECX in) or sell (tokens in).
  string side = 2;
  // Decimal: ECX for a buy (fee included), tokens for a sale.
  string amount = 3;
  // The floor below the quote, in basis points (default 100, at most 5000).
  uint32 slippage_bps = 4;
}

message LaunchQuote {
  string side = 1;
  double ecx = 2;
  double tokens = 3;
  double fee_ecx = 4;
  double avg_price = 5;
  double price_after = 6;
  double impact = 7;
  double raised_after = 8;
  double refund_ecx = 9;
  string amount_in_units = 10;
  string amount_out_units = 11;
  // What the order asks at least (amount_out less the slippage, rounded down): the hand-off's floor.
  string min_out_units = 12;
  double min_out = 13;
  uint32 slippage_bps = 14;
  bool graduates = 15;
  double progress_after = 16;
  double spot_price = 17;
  // The tip the quote is of.
  uint32 height = 18;
  string id = 19;
  string ticker = 20;
}

message GetLogoRequest {
  string id = 1;
  // The version the API's URLs give (?v=<the first 12 hex digits of the logo's SHA-256>), so that a cache keeps a logo
  // until it changes: ignored here.
  string v = 2;
}

// A logo's bytes (REST: served as the image itself, after its magic bytes are checked).
message Logo {
  bytes data = 1;
  // image/png or image/jpeg.
  string content_type = 2;
  string sha256 = 3;
}

message GetLaunchStatsRequest {}

message LaunchStats {
  uint32 launches = 1;
  uint32 on_curve = 2;
  uint32 graduated = 3;
  double volume_ecx = 4;
  double raised_ecx = 5;
  double graduation_ecx = 6;
  double fee_percent = 7;
  double creator_share_percent = 8;
  CurveParams curve = 9;
  bool active = 10;
  uint32 launches_24h = 11;
  uint32 graduated_24h = 12;
  double volume_24h = 13;
}

message GetLaunchLogRequest {
  uint32 from_height = 1;
  // At most 1000 blocks (default from_height).
  uint32 to_height = 2;
}

message LaunchLogRow {
  uint32 height = 1;
  string id = 2;
  string ticker = 3;
  bool created = 4;
  bool graduated = 5;
  uint32 orders = 6;
  double coin_in = 7;
  double coin_out = 8;
  double tokens_in = 9;
  double tokens_out = 10;
  double fees = 11;
  double reserve_coin = 12;
  double reserve_tokens = 13;
}

message LaunchLog {
  repeated LaunchLogRow items = 1;
}

// ---------------------------------------------------------------------------------------------------------
// Pools, positions, books, the market index

message ConcentratedState {
  string sqrt_price_x96 = 1;
  int32 tick = 2;
  string liquidity = 3;
  int32 tick_spacing = 4;
}

message Pool {
  string pool = 1;
  string asset_a = 2;
  string asset_b = 3;
  optional string asset_a_id = 4;
  optional string asset_b_id = 5;
  double reserve_a = 6;
  double reserve_b = 7;
  optional double price = 8;
  double shares = 9;
  double volume_a = 10;
  double volume_b = 11;
  uint32 swaps = 12;
  uint32 created = 13;
  bool abandoned = 14;
  string name = 15;
  optional string logo = 16;
  double liquidity_ecx = 17;
  double volume_24h = 18;
  optional double change_24h = 19;
  // The launch it graduated from (its ticker), or null for a pool made by hand.
  optional string launch = 20;
  // Its shares are nobody's (a graduated launch's pool): its liquidity stays for good.
  bool locked = 21;

  // Its kind: constant_product, stable, weighted, concentrated, launch, book.
  string curve = 30;
  uint32 fee_ppm = 31;
  double fee_bps = 32;
  optional uint32 amp = 33;
  optional uint32 weight_a = 34;
  optional uint32 weight_b = 35;
  bool default_kind = 36;
  bool dynamic_fee = 37;
  optional double fee_now_bps = 38;
  ConcentratedState concentrated = 39;
  // The market index's measures (searchpools): ECX held, ECX traded in its window, the change of price over it.
  double depth_ecx = 40;
  double volume_window_ecx = 41;
  double price_change_window = 42;
  uint32 last_activity = 43;
  string shares_units = 44;
  string reserve_a_units = 45;
  string reserve_b_units = 46;
}

message ListPoolsRequest {
  // liquidity (default), volume, change, newest.
  string sort = 1;
  string q = 2;
  // Only pools of this kind (constant_product, stable, weighted, concentrated, book, launch); default all but launch curves.
  string kind = 3;
  // Only this fee tier, in millionths (100, 500, 3000, 10000).
  uint32 fee_ppm = 4;
  bool ecx_only = 5;
  bool include_abandoned = 6;
  string cursor = 7;
  // 1 to 200 (default 50).
  uint32 limit = 8;
}

message PoolPage {
  repeated Pool items = 1;
  optional string next_cursor = 2;
  uint32 total = 3;
  // The search stopped at its budget: next_cursor goes on.
  bool partial = 4;
}

message GetPoolRequest {
  // A pool's id; or the two assets (tickers, ids, ECX) of the default pool of the pair.
  string pool = 1;
  string asset_a = 2;
  string asset_b = 3;
}

message ListPoolTicksRequest {
  string pool = 1;
  // 1 to 500 (default 200).
  uint32 limit = 2;
}

message Tick {
  int32 tick = 1;
  // asset_b per whole asset_a at the tick.
  double price = 2;
  string liquidity_net = 3;
  string liquidity_gross = 4;
}

message PoolTicks {
  string pool = 1;
  int32 tick = 2;
  string sqrt_price_x96 = 3;
  string liquidity = 4;
  int32 tick_spacing = 5;
  repeated Tick items = 6;
}

message GetPositionRequest {
  string id = 1;
}

message Position {
  string id = 1;
  string pool = 2;
  int32 tick_lower = 3;
  int32 tick_upper = 4;
  double price_lower = 5;
  double price_upper = 6;
  string liquidity = 7;
  double amount_a = 8;
  double amount_b = 9;
  double fees_a = 10;
  double fees_b = 11;
  bool in_range = 12;
  string txid = 13;
  uint32 height = 14;
  string asset_a = 15;
  string asset_b = 16;
  // In a portfolio of several addresses: the one holding it (empty elsewhere).
  string owner = 17;
}

message GetBookRequest {
  // The asset sold by asks (the base), and what it is priced in (default ECX).
  string base = 1;
  string quote = 2;
  // Price levels a side (1 to 100, default 20).
  uint32 depth = 3;
}

message BookLevel {
  double price = 1;
  double amount = 2;
  uint32 orders = 3;
  double total = 4;
  // The price exactly (the orders' limit, 18 significant digits), the amount in units of the base.
  string price_exact = 5;
  string amount_units = 6;
}

message Book {
  string book = 1;
  string base = 2;
  string quote = 3;
  repeated BookLevel asks = 4;
  repeated BookLevel bids = 5;
  optional double best_ask = 6;
  optional double best_bid = 7;
  optional double spread = 8;
  uint32 ask_orders = 9;
  uint32 bid_orders = 10;
  optional string best_ask_exact = 11;
  optional string best_bid_exact = 12;
}

// ---------------------------------------------------------------------------------------------------------
// The asset registry: every asset, with its markets

message AssetMarket {
  // none, curve (on its launch curve), pool, book, auction: the first of these it has.
  string status = 1;
  // Every kind of market it has.
  repeated string kinds = 2;
  // On a curve: the part of the graduation amount raised, 0 to 1.
  optional double progress = 3;
  uint32 pools = 4;
  uint32 books = 5;
  uint32 auctions = 6;
  // ECX for a whole unit: its curve's, else its pool with ECX's.
  optional double price_ecx = 7;
  // ECX traded in its pools and auctions with ECX over the volume window (about a day).
  double volume_24h_ecx = 8;
}

// AssetSummary and AssetDetail share their field numbers (a detail is a summary and more).
message AssetSummary {
  string id = 1;
  string ticker = 2;
  optional string display_name = 3;
  // Its description (plain text; the first 280 characters in a list).
  string info = 4;
  uint32 decimals = 5;
  double supply = 6;
  string supply_units = 7;
  uint32 holders = 8;
  optional string logo = 9;
  // No control coin: nobody mints more (a launch's, or one fixed).
  bool fixed_supply = 10;
  uint32 registered_height = 11;
  string registration_txid = 12;
  // Launched, or put on a curve.
  bool launched = 13;
  AssetMarket market = 14;
  // The address that holds its control coin, if any.
  optional string controller = 15;
  uint32 seq = 16;
}

message AssetBook {
  string id = 1;
  string base = 2;
  string quote = 3;
  string base_ticker = 4;
  string quote_ticker = 5;
  uint32 bids = 6;
  uint32 asks = 7;
  optional double best_bid = 8;
  optional double best_ask = 9;
}

message AssetAuction {
  string id = 1;
  double base_amount = 2;
  string quote = 3;
  string quote_ticker = 4;
  // The price of all of it now, in the quote.
  double price = 5;
  uint32 start_height = 6;
  uint32 end_height = 7;
  // upcoming, live, ended, sold_out.
  string status = 8;
  double remaining = 9;
}

message CanCurve {
  bool allowed = 1;
  optional string reason = 2;
}

message AssetDetail {
  string id = 1;
  string ticker = 2;
  optional string display_name = 3;
  // Its whole description.
  string info = 4;
  uint32 decimals = 5;
  double supply = 6;
  string supply_units = 7;
  uint32 holders = 8;
  optional string logo = 9;
  bool fixed_supply = 10;
  uint32 registered_height = 11;
  string registration_txid = 12;
  bool launched = 13;
  AssetMarket market = 14;
  optional string controller = 15;
  uint32 seq = 16;

  // Its creator's links (safe links only).
  repeated LaunchLink links = 31;
  // Its launch (or curve), if any.
  LaunchSummary launch = 32;
  // Its pools (every kind but books and curves; at most 50), books (at most 10) and auctions not collected (at most 20).
  repeated Pool pools = 33;
  repeated AssetBook books = 34;
  repeated AssetAuction auctions = 35;
  // Whether its controller may put part of it on a curve now (curveasset), and why not.
  CanCurve can_curve = 36;
}

message ListAssetsRequest {
  // Text in the ticker or the display name, a number, or an id.
  string q = 1;
  // newest (default), oldest, name, supply, volume, holders (within the page), activity.
  string sort = 2;
  // all (default), none, curve, pool, book, auction: of the assets of the page (a page may hold fewer: go on with next_cursor).
  string market = 3;
  string cursor = 4;
  // 1 to 100 (default 50).
  uint32 limit = 5;
}

message AssetPage {
  repeated AssetSummary items = 1;
  optional string next_cursor = 2;
  uint32 total = 3;
}

message GetAssetRequest {
  // Its ticker (any case), number or id.
  string id = 1;
}

// ---------------------------------------------------------------------------------------------------------
// Assets and addresses

message GetTickerRequest {
  string ticker = 1;
}

message TickerAvailability {
  string ticker = 1;
  bool available = 2;
  // Why not: invalid, taken, retired-in-use...
  string reason = 3;
}

message GetHoldingsRequest {
  string address = 1;
}

message Holding {
  string ticker = 1;
  double amount = 2;
  double value_ecx = 3;
  string asset_id = 4;
  // asset, lp, position, order.
  string kind = 5;
  string amount_units = 6;
}

message Holdings {
  repeated Holding items = 1;
  string address = 2;
}

// What an address holds and made (GET addresses/{address}/portfolio): the site's portfolio after Connect.
message GetPortfolioRequest {
  string address = 1;
  // Several addresses at once (7.0.1: a wallet's, as flush:connect shares them), 1 to 200, with or without `address`:
  // the assets summed over them, the rest of each listed with its owner. REST: GET addresses/portfolio?addresses=a,b
  // (64 at most), or POST addresses/portfolio with {"addresses": [...]}.
  repeated string addresses = 2;
}

message AssetRef {
  // 64 hex digits; empty for ECX.
  string id = 1;
  string ticker = 2;
}

message PortfolioAsset {
  string asset_id = 1;
  string ticker = 2;
  uint32 decimals = 3;
  // Summed over the addresses asked.
  double amount = 4;
  string amount_units = 5;
  double value_ecx = 6;
  // How many of the addresses hold it.
  uint32 holders = 7;
}

message PortfolioLiquidity {
  string pool = 1;
  string shares_units = 2;
  // Of the pool's shares (0 to 1), and what that is of each asset now.
  double share = 3;
  AssetRef asset_a = 4;
  AssetRef asset_b = 5;
  double amount_a = 6;
  double amount_b = 7;
  Pool pool_info = 8;
  // The address it is held by (or, a launch, made by).
  string owner = 9;
}

message PortfolioOrder {
  string order = 1;
  string book = 2;
  AssetRef sell = 3;
  AssetRef buy = 4;
  double price = 5;
  double amount = 6;
  double remaining = 7;
  double to_collect = 8;
  uint32 expiry = 9;
  // open, filled, expired or evicted.
  string status = 10;
  // The address it is held by (or, a launch, made by).
  string owner = 11;
}

message PortfolioAuction {
  string auction = 1;
  AssetRef base = 2;
  AssetRef quote = 3;
  double amount = 4;
  double remaining = 5;
  double proceeds = 6;
  double price = 7;
  string status = 8;
  uint32 end_height = 9;
  // The address it is held by (or, a launch, made by).
  string owner = 10;
}

message PortfolioLaunch {
  string id = 1;
  string ticker = 2;
  // curve or graduated.
  string state = 3;
  double progress = 4;
  double allocation_percent = 5;
  bool allocation_claimed = 6;
  double creator_fees_owed_ecx = 7;
  bool claimable_fees = 8;
  bool claimable_allocation = 9;
  // The address it is held by (or, a launch, made by).
  string owner = 10;
}

message Portfolio {
  // The first address asked; `addresses` all of them, as read (each once, in the order asked).
  string address = 1;
  uint32 height = 2;
  repeated string addresses = 9;
  // Whether something was left out: an address holding more than the index reads of one (500 holdings), or more than
  // 100 holdings other than assets in all.
  bool truncated = 10;
  repeated PortfolioAsset assets = 3;
  repeated PortfolioLiquidity liquidity = 4;
  repeated Position positions = 5;
  repeated PortfolioOrder orders = 6;
  repeated PortfolioAuction auctions = 7;
  repeated PortfolioLaunch launches = 8;
}

message GetVerificationsRequest {
  // Assets (tickers or ids, 1 to 50) and the curators the client trusts (oracle ids or keys, 1 to 20): verification
  // is per curator list, the API keeps none of its own.
  repeated string assets = 1;
  repeated string curators = 2;
}

message CuratorWord {
  string curator = 1;
  string name = 2;
  bool verified = 3;
  uint32 round = 4;
  optional uint32 height = 5;
}

message Verification {
  string asset = 1;
  bool verified = 2;
  repeated CuratorWord curators = 3;
}

message Verifications {
  repeated Verification items = 1;
}

// ---------------------------------------------------------------------------------------------------------
// Quotes: the node's own (the same code as the app's quoteswap, getswapquote, quoteroute, quotelaunch,
// quotepoolliquidity, previewposition), each as the only order of its block would get it.

message QuoteSwapRequest {
  string from = 1;
  string to = 2;
  // Decimal, in `from`.
  string amount = 3;
  uint32 slippage_bps = 4;
  // Most pools on a route, 0 to 4 (default 3; 0: the pair's own pools only).
  uint32 max_hops = 5;
}

message Hop {
  string pool = 1;
  string curve = 2;
  double fee_bps = 3;
  string asset_in = 4;
  string asset_out = 5;
  double amount_out = 6;
}

message SwapOption {
  // pool (one pool of the pair: a pool of any kind, or the pair's book) or route.
  string venue = 1;
  repeated string pools = 2;
  // Asset ids of the path ("" for ECX), and their tickers.
  repeated string path_ids = 3;
  repeated string path = 4;
  double amount_out = 5;
  string amount_out_units = 6;
  double price = 7;
  double price_impact = 8;
  repeated Hop hops = 9;
  bool default_pools = 10;
}

message SwapQuote {
  string from = 1;
  string to = 2;
  string from_id = 3;
  string to_id = 4;
  double amount_in = 5;
  string amount_in_units = 6;
  // The best option's.
  double amount_out = 7;
  string amount_out_units = 8;
  string min_out_units = 9;
  double min_out = 10;
  uint32 slippage_bps = 11;
  SwapOption best = 12;
  repeated SwapOption options = 13;
  uint32 height = 14;
}

message QuoteLiquidityRequest {
  string pool = 1;
  // deposit (amount_a and/or amount_b, decimals of the pool's asset_a/asset_b) or withdraw (shares; `only`: a or b
  // to take one side alone).
  string action = 2;
  string amount_a = 3;
  string amount_b = 4;
  string shares = 5;
  string only = 6;
  uint32 slippage_bps = 7;
}

message LiquidityQuote {
  string pool = 1;
  string action = 2;
  string asset_a = 3;
  string asset_b = 4;
  double amount_a = 5;
  double amount_b = 6;
  string amount_a_units = 7;
  string amount_b_units = 8;
  double shares = 9;
  string shares_units = 10;
  // The floors the action asks (shares for a deposit, each asset for a withdrawal).
  string min_shares_units = 11;
  string min_a_units = 12;
  string min_b_units = 13;
  double share_of_pool = 14;
  uint32 slippage_bps = 15;
  uint32 height = 16;
}

message QuotePositionRequest {
  string pool = 1;
  double price_lower = 2;
  double price_upper = 3;
  string amount_a = 4;
  string amount_b = 5;
}

message PositionQuote {
  string pool = 1;
  int32 tick_lower = 2;
  int32 tick_upper = 3;
  double price_lower = 4;
  double price_upper = 5;
  string liquidity = 6;
  double amount_a = 7;
  double amount_b = 8;
  string amount_a_units = 9;
  string amount_b_units = 10;
  bool in_range = 11;
  uint32 height = 12;
}

// ---------------------------------------------------------------------------------------------------------
// The write path: builds (unsigned, fully specified actions for the Flush app or a wallet extension) and the
// broadcast of transactions signed elsewhere. The server holds no key and signs nothing.

message BuildActionRequest {
  // buy, sell, swap, deposit, withdraw, launch.
  string verb = 1;
  // buy, sell: the launch (ticker or id).
  string launch = 2;
  // buy: ECX to pay (fee included); sell: tokens; swap: what goes in; decimal.
  string amount = 3;
  // swap: the assets (tickers, ids or ECX).
  string from = 4;
  string to = 5;
  // deposit, withdraw: the pool.
  string pool = 6;
  string amount_a = 7;
  string amount_b = 8;
  string shares = 9;
  string only = 10;
  uint32 slippage_bps = 11;
  uint32 max_hops = 12;
  // How long the action stays good, in seconds (60 to 3600, default 600).
  uint32 expires_in = 13;
  // launch: the request (ticker, display name, description, https links, logo hash, first buy).
  string ticker = 14;
  string name = 15;
  string description = 16;
  repeated string links = 17;
  string logo_sha256 = 18;
  string first_buy_ecx = 19;
  // launch (optional), register: the supply in whole units and its decimals; launch, curve: the curve's fee (basis points,
  // 30 to 500); launch: the creator's allocation (basis points, 0 to status.launch_params.allocation_max_bps: 1000, or 500 before allocation10_height).
  string supply = 20;
  optional uint32 decimals = 21;
  uint32 fee_bps = 22;
  uint32 allocation_bps = 23;
  // curve: the asset and the amount (amount); the bounds of a buy (ECX).
  string asset = 24;
  string min_buy = 25;
  string max_buy = 26;
  // pool: its two assets (ids, tickers or ECX), kind (constant, stable, weighted), fee tier (millionths), amp, weight_a
  // (amount_a, amount_b above).
  string asset_a = 27;
  string asset_b = 28;
  string kind = 29;
  uint32 fee_ppm = 30;
  uint32 amp = 31;
  uint32 weight_a = 32;
  // auction: what it sells (base, amount), for what (quote), the price of all of it at the start and the end, its blocks,
  // and the blocks until it starts.
  string base = 33;
  string quote = 34;
  string start_price = 35;
  string end_price = 36;
  uint32 duration = 37;
  uint32 delay = 38;
  // order: what it sells (sell, amount) for what (buy), its limit (buy per whole sell), its blocks.
  string sell = 39;
  string buy = 40;
  string price = 41;
  uint32 expiry_blocks = 42;
  // position: its range (asset_b per asset_a, the pool's order; amount_a, amount_b the most of each).
  string price_lower = 43;
  string price_upper = 44;
  // reposition: the position, and collect, remove (percent) or close.
  string position = 45;
  string action = 46;
  uint32 percent = 47;
  // settle: the order, and whether to cancel it (else collect what it got).
  string order = 48;
  bool cancel = 49;
  // bid, collect: the auction; bid: amount in its quote, buy_all.
  string auction = 50;
  bool buy_all = 51;
  // pegin: the Flush address credited (optional: then the deposit address for any eCash wallet); pegout: the eCash
  // address paid, and the fee to eCash's miners (ECX).
  string address = 52;
  string fee = 53;
  // position: the pool's price the page expects (asset_b per asset_a): the wallet refuses at signing if the pool's is
  // further from it than the slippage (a pool opened or moved by someone else first).
  string expected_price = 54;
  reserved 55;
  // launch (upgrade v7, status.launch_params.fee_split_active): the split of the tunable part of its fees, as the link's
  // split=: "<to>:<bps>" each ("creator", "burn" or an address; the query takes split= again or one list, comma
  // separated), 1 to 5 entries summing to 10000: "creator" and "burn" at most once each, up to 3 addresses. None: all to the creator.
  repeated string split = 56;
  // launch (7.0.1): the creator keeps the control coin (Unlocked Supply: it can mint more); in the link keep_control=1.
  bool keep_control = 57;
  // launch, register (8.1.0): where the site hosts the logo named by logo_sha256 (only with it), in the link logo_url=:
  // an https address of a DNS name (not an IP address, not localhost), 512 characters at most. The app downloads it
  // (no redirect, 32 KiB at most) and keeps it only if its SHA-256 is logo_sha256; else it asks for the file.
  string logo_url = 58;
}

message Fact {
  string label = 1;
  string value = 2;
}

message BuiltAction {
  string verb = 1;
  string network = 2;
  // The flush: URI (doc/public-api.md; flush.markets docs/uri.md) for the app, a link or a QR code.
  string uri = 3;
  // The same action as canonical JSON (keys sorted, no spaces, amounts as decimal strings): what a wallet
  // extension signs for, its hash shown by the wallet beside the action.
  string payload = 4;
  // SHA-256 of "flush-action/v1\n" and the payload, hex; and its first 8 digits, the check code the app shows.
  string payload_hash = 5;
  string check_code = 6;
  uint32 expires = 7;
  uint32 height = 8;
  // A sentence of what it does, for the page.
  string summary = 9;
  // The quote it was built from (one of these).
  LaunchQuote launch_quote = 10;
  SwapQuote swap_quote = 11;
  LiquidityQuote liquidity_quote = 12;
  // Whether the Flush app's links take this verb (every verb built now: an older app refuses the newer ones, it fails closed).
  bool app_ready = 13;
  // What the page shows beside the summary (an order's, an auction's, a position's, a launch's state).
  repeated Fact facts = 14;
  // pegin with an address: the eCash deposit address that credits it (any eCash wallet pays it).
  string deposit_address = 15;
}

message BroadcastRequest {
  // The signed transaction, hex.
  string hex = 1;
}

message BroadcastReply {
  string txid = 1;
}

// 8.1.0: a logo kept for a while by its SHA-256 (POST /api/v1/logos), so that a link can name where it is hosted
// (logo_url): a site uploads it here and gives the app the address. Checked with the chain's rules of logos.
message UploadLogoRequest {
  // The image, base64: a PNG or JPEG the chain takes (256x256, 32 KiB at most, no metadata).
  string base64 = 1;
}

message UploadLogoReply {
  // Its SHA-256, 64 lowercase hex digits (the link's logo=sha256:<it>).
  string sha256 = 1;
  // Where it is served, relative to the API's origin: /api/v1/logos/<sha256>.
  string url = 2;
}

message GetUploadedLogoRequest {
  string sha256 = 1;
}

// 8.2.0: what became of an order (GET trades/{txid}, GET addresses/{address}/trades), from the market index: a swap of
// the batch (any pool kind, a route, a launch buy or sale), filled or missed; a limit order resting in a book.
message GetTradeRequest {
  // The order's transaction (a swap's, a PlaceOrder's), or a SettleOrder's (its order's outcome).
  string txid = 1;
}

message ListAddressTradesRequest {
  string address = 1;
  string cursor = 2;
  // 1 to 100 (default 50).
  uint32 limit = 3;
}

// Something paid out of an order: by the coinbase of its block (ECX, to `address`), or as a token on an output.
message TradePayout {
  // out (what a swap got), back (ECX a launch buy got back at the curve's end), refund (a missed swap's), proceeds
  // (what a limit order got), left (what it had left to sell).
  string what = 1;
  string asset = 2;
  string asset_id = 3;
  string amount_units = 4;
  double amount = 5;
  // coinbase or output.
  string via = 6;
  string address = 7;
  // via output: txid:n.
  optional string outpoint = 8;
}

message TradeHop {
  string pool = 1;
  // constant_product, stable, weighted, launch, concentrated, book (as the batch found it).
  string curve = 2;
  // curve (a launch's), pool, book: as the trades' venue.
  string venue = 3;
  // A launch curve's: its token's id.
  optional string launch = 4;
  string asset_in = 5;
  string asset_out = 6;
  // Filled: what went in and out of this hop.
  string amount_in_units = 7;
  string amount_out_units = 8;
}

message SwapOutcome {
  // The assets in order (tickers, ECX), and their ids.
  repeated string path = 1;
  repeated string path_ids = 2;
  repeated TradeHop hops = 3;
  // What went in, then what came out of each hop (a miss: what went in only).
  repeated string amounts_units = 4;
  string amount_in_units = 5;
  string back_units = 6;
  // Filled: out (and back); missed: refund.
  repeated TradePayout payouts = 7;
}

message OrderFill {
  uint32 height = 1;
  uint32 time = 2;
  string sold_units = 3;
  string got_units = 4;
}

// A SettleOrder: one that collected what the order got (it stays), or the one that closed it.
message OrderSettle {
  string txid = 1;
  uint32 height = 2;
  uint32 time = 3;
  bool cancel = 4;
  repeated TradePayout payouts = 5;
}

message OrderOutcome {
  string order_id = 1;
  string book = 2;
  // ask (sells the pair's asset_b: the token against ECX), bid (sells asset_a), as trades' sides.
  string side = 3;
  string sell = 4;
  string sell_id = 5;
  string buy = 6;
  string buy_id = 7;
  string amount_units = 8;
  // Its limit: price_num/price_den units of what it buys per unit of what it sells, at least; `price` in whole units.
  string price_num = 9;
  string price_den = 10;
  double price = 11;
  // The last block it trades in.
  uint32 expiry = 12;
  string remaining_units = 13;
  string got_units = 14;
  // The block it was evicted in (0: never).
  uint32 evicted = 15;
  // The output its token went to (the owner's).
  string owner_outpoint = 16;
  // Each block that filled some of it, oldest first (the first 1000; 20 in a listing), and how many.
  repeated OrderFill fills = 17;
  uint32 fill_count = 18;
  repeated OrderSettle collected = 19;
  uint32 collect_count = 20;
  optional OrderSettle settle = 21;
}

message TradeOutcome {
  // The order's transaction.
  string txid = 1;
  // swap or order.
  string kind = 2;
  // The block it was made (a swap: cleared) in.
  uint32 height = 3;
  uint32 time = 4;
  // swap: filled, missed; order: open, filled, expired, evicted, cancelled, settled.
  string status = 5;
  // A swap's payee (who got its payout or refund), an order's owner; and the script.
  string address = 6;
  string script = 7;
  // Found by a SettleOrder of the order: its txid.
  optional string settle_txid = 8;
  optional SwapOutcome swap = 9;
  optional OrderOutcome order = 10;
}

message TradeOutcomePage {
  repeated TradeOutcome items = 1;
  optional string next_cursor = 2;
  uint32 total = 3;
  string address = 4;
}

// ---------------------------------------------------------------------------------------------------------

service DexService {
  rpc GetStatus(GetStatusRequest) returns (ChainStatus) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetStats(GetStatsRequest) returns (Stats) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetFees(GetFeesRequest) returns (FeeSchedule) { option idempotency_level = NO_SIDE_EFFECTS; }

  rpc ListLaunches(ListLaunchesRequest) returns (LaunchPage) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetLaunch(GetLaunchRequest) returns (LaunchDetail) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListLaunchTrades(ListTradesRequest) returns (TradePage) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetLaunchCandles(GetCandlesRequest) returns (CandleList) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListLaunchHolders(ListHoldersRequest) returns (HolderPage) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc QuoteLaunch(QuoteLaunchRequest) returns (LaunchQuote) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetLaunchLogo(GetLogoRequest) returns (Logo) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetLaunchStats(GetLaunchStatsRequest) returns (LaunchStats) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetLaunchLog(GetLaunchLogRequest) returns (LaunchLog) { option idempotency_level = NO_SIDE_EFFECTS; }

  rpc ListPools(ListPoolsRequest) returns (PoolPage) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetPool(GetPoolRequest) returns (Pool) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListPoolTrades(ListTradesRequest) returns (TradePage) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetPoolCandles(GetCandlesRequest) returns (CandleList) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListPoolTicks(ListPoolTicksRequest) returns (PoolTicks) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetPosition(GetPositionRequest) returns (Position) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetBook(GetBookRequest) returns (Book) { option idempotency_level = NO_SIDE_EFFECTS; }

  rpc GetTicker(GetTickerRequest) returns (TickerAvailability) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetHoldings(GetHoldingsRequest) returns (Holdings) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetPortfolio(GetPortfolioRequest) returns (Portfolio) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetVerifications(GetVerificationsRequest) returns (Verifications) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetAssetLogo(GetLogoRequest) returns (Logo) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListAssets(ListAssetsRequest) returns (AssetPage) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetAsset(GetAssetRequest) returns (AssetDetail) { option idempotency_level = NO_SIDE_EFFECTS; }

  rpc QuoteSwap(QuoteSwapRequest) returns (SwapQuote) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc QuoteLiquidity(QuoteLiquidityRequest) returns (LiquidityQuote) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc QuotePosition(QuotePositionRequest) returns (PositionQuote) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc BuildAction(BuildActionRequest) returns (BuiltAction) { option idempotency_level = NO_SIDE_EFFECTS; }

  rpc Broadcast(BroadcastRequest) returns (BroadcastReply);

  // 8.1.0: logos kept for an hour by their SHA-256 (links name where they are: logo_url).
  rpc UploadLogo(UploadLogoRequest) returns (UploadLogoReply);
  rpc GetUploadedLogo(GetUploadedLogoRequest) returns (Logo) { option idempotency_level = NO_SIDE_EFFECTS; }

  // 8.2.0: orders' outcomes (the market index), by transaction and by address.
  rpc GetTrade(GetTradeRequest) returns (TradeOutcome) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListAddressTrades(ListAddressTradesRequest) returns (TradeOutcomePage) { option idempotency_level = NO_SIDE_EFFECTS; }
}
